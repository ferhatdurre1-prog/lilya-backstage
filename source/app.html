/* Layout: depo defteri — sakin adaçayı zemin, koyu orman yeşili marka, sayılar her yerde hizalı; masaüstünde üst sekme, telefonda alt menü */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f3f4f7; --line:#e7e9ee; --line-strong:#d5d9e1;
  --ink:#0e1016; --ink-2:#4b5161; --ink-3:#8b91a0;
  --brand:#111318; --brand-ink:#ffffff; --brand-soft:#eef0f4;
  --accent:#4f46e5; --accent-soft:#eef0ff;
  --brass:#b7791f; --brass-soft:#fdf3e1;
  --good:#0ea371; --good-soft:#dcf7ec; --warn:#f08a12; --warn-soft:#fff2e0; --bad:#ef4444; --bad-soft:#fde7e7;
  --blue:#3b6ef6; --blue-soft:#e6edff; --violet:#7c5cf6; --violet-soft:#f0ebff; --orange:#f97316;
  --hero:radial-gradient(120% 90% at 100% 0%,rgba(99,102,241,.38) 0%,rgba(99,102,241,0) 55%),radial-gradient(80% 70% at 0% 100%,rgba(56,189,248,.14) 0%,rgba(56,189,248,0) 60%),linear-gradient(160deg,#0a0b10 0%,#131622 60%,#1a1e2d 100%);
  --ty:#e8650f; --ty-soft:#fdeadb; --sh:#5a8a2a; --sh-soft:#e7f2da; --hb:#e07812; --hb-soft:#fdecd8; --tm:#e2522f; --tm-soft:#fde4dc; --mn:#5d6475; --mn-soft:#eceef3;
  --shadow:0 1px 2px rgba(15,18,30,.04),0 8px 24px rgba(15,18,30,.07);
  --f-display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0b0f; --surface:#13151c; --surface-2:#1a1d26; --line:#252935; --line-strong:#343a49;
  --ink:#eef0f5; --ink-2:#b3b9c7; --ink-3:#7f8696;
  --brand:#f4f5f8; --brand-ink:#0e1016; --brand-soft:#232735;
  --accent:#8b8cff; --accent-soft:#25264a;
  --brass:#e9b95c; --brass-soft:#3a3120;
  --good:#34d399; --good-soft:#123327; --warn:#fbab4b; --warn-soft:#3d2a12; --bad:#f87171; --bad-soft:#421e1e;
  --blue:#7aa2ff; --blue-soft:#1b2646; --violet:#a78bfa; --violet-soft:#2a2148; --orange:#fb923c;
  --hero:radial-gradient(120% 90% at 100% 0%,rgba(99,102,241,.32) 0%,rgba(99,102,241,0) 55%),linear-gradient(160deg,#07080c 0%,#10121b 60%,#161a27 100%);
  --ty:#fb923c; --ty-soft:#3d2614; --sh:#a3d977; --sh-soft:#26361b; --hb:#fbab4b; --hb-soft:#3d2a12; --tm:#f8826a; --tm-soft:#42231c; --mn:#a5acbb; --mn-soft:#232735;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0a0b0f; --surface:#13151c; --surface-2:#1a1d26; --line:#252935; --line-strong:#343a49;
  --ink:#eef0f5; --ink-2:#b3b9c7; --ink-3:#7f8696;
  --brand:#f4f5f8; --brand-ink:#0e1016; --brand-soft:#232735;
  --accent:#8b8cff; --accent-soft:#25264a;
  --brass:#e9b95c; --brass-soft:#3a3120;
  --good:#34d399; --good-soft:#123327; --warn:#fbab4b; --warn-soft:#3d2a12; --bad:#f87171; --bad-soft:#421e1e;
  --blue:#7aa2ff; --blue-soft:#1b2646; --violet:#a78bfa; --violet-soft:#2a2148; --orange:#fb923c;
  --hero:radial-gradient(120% 90% at 100% 0%,rgba(99,102,241,.32) 0%,rgba(99,102,241,0) 55%),linear-gradient(160deg,#07080c 0%,#10121b 60%,#161a27 100%);
  --ty:#fb923c; --ty-soft:#3d2614; --sh:#a3d977; --sh-soft:#26361b; --hb:#fbab4b; --hb-soft:#3d2a12; --tm:#f8826a; --tm-soft:#42231c; --mn:#a5acbb; --mn-soft:#232735;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3); color-scheme:dark;}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:-.01em}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
/* header */
.top{display:flex;align-items:center;gap:12px;padding-block:16px 12px}
.hero{background:var(--hero);color:#fff;border-radius:0 0 26px 26px;padding-bottom:12px;margin-bottom:18px}
body[data-tab="home"] .hero{padding-bottom:52px;margin-bottom:0}
body[data-tab="home"] main{margin-top:-40px;position:relative}
.hero .eyebrow{color:rgba(255,255,255,.6)} .hero .brandtxt h1{color:#fff}
.hero .mark{background:url(/icon.svg?v=3) center/cover no-repeat;color:transparent;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.12)}
.hero .burger{color:#fff}
.hero .conn{color:rgba(255,255,255,.75)} .hero .conn.err{color:#ff9a9a}
.hero .conn.ok i{background:#4ade8a;box-shadow:0 0 0 3px rgba(74,222,138,.2)}
.hero .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:#fff}
.mark{width:40px;height:40px;border-radius:11px;background:#111318 url(/icon.svg?v=3) center/cover no-repeat;color:transparent;display:grid;place-items:center;font-family:var(--f-display);font-size:20px;font-weight:800;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.brandtxt{min-width:0;flex:1}
.brandbtn{display:flex;align-items:center;gap:12px;border:0;background:none;padding:0;cursor:pointer;text-align:left;color:inherit;flex:1;min-width:0}
.burger{border:0;background:none;padding:8px;margin-left:-8px;cursor:pointer;color:var(--ink);display:grid;place-items:center;border-radius:10px}
.burger svg{width:24px;height:24px}
.drawer-scrim{position:fixed;inset:0;background:rgba(20,24,22,.38);z-index:60;animation:fadein .15s}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,84vw);background:var(--surface);z-index:61;box-shadow:0 0 40px rgba(0,0,0,.18);padding:calc(18px + env(safe-area-inset-top,0px)) 14px 18px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;animation:slidein .18s ease-out}
.drawer .dh{display:flex;align-items:center;gap:12px;padding:4px 6px 16px;border-bottom:1px solid var(--line);margin-bottom:8px}
.drawer button.di{display:flex;align-items:center;gap:12px;border:0;background:none;padding:12px 10px;border-radius:10px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer;text-align:left;width:100%}
.drawer button.di svg{width:21px;height:21px;color:var(--ink-3);flex:none}
.drawer button.di[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.drawer button.di[aria-current="page"] svg{color:var(--accent)}
.drawer .di .cnt{margin-left:auto;min-width:20px;padding:1px 6px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:600;text-align:center}
.drawer .sep{height:1px;background:var(--line);margin:8px 0}
@keyframes slidein{from{transform:translateX(-100%)}to{transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.chart7 svg{width:100%;height:auto;display:block}
.chart7 .lg{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin:2px 0 8px}
.chart7 .lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c,var(--brand))}
.kpi .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi .k{font-size:12.5px;color:var(--ink-2);font-weight:600}
.kpi .ki{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--cs,var(--brand-soft));color:var(--c,var(--brand));flex:none}
.kpi .ki svg{width:17px;height:17px}
.kpi .v{font-size:23px;font-weight:700;line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--ink-3);margin-top:4px}
.kpi .s .up{color:var(--good);font-weight:600} .kpi .s .dn{color:var(--bad);font-weight:600}
.act-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.act{border:0;background:var(--surface-2);border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;font:inherit;color:var(--ink);display:grid;gap:4px;justify-items:center}
.act .l{font-size:13px;color:var(--ink-2);font-weight:500}
.act .n{font-size:21px;font-weight:700;color:var(--orange);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:3px}
.act .n svg{width:16px;height:16px}
.act.zero .n{color:var(--good)} .act.hot .n{color:var(--bad)}
.act:active{transform:scale(.98)}
.alert-row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;font:inherit;color:inherit}
.alert-row:first-of-type{border-top:0}
.alert-row .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.alert-row .ic svg{width:18px;height:18px}
.alert-row .tx{flex:1;min-width:0}.alert-row .tx b{display:block;font-size:14.5px}.alert-row .tx span{font-size:12.5px;color:var(--ink-3)}
.eyebrow{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.brandtxt h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.1;letter-spacing:-.03em}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.conn i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.conn.ok i{background:var(--good)} .conn.err i{background:var(--bad)} .conn.warn i{background:var(--warn)} .conn.err{color:var(--bad)}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px 11px;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--brand)}
.tabs .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--warn-soft);color:var(--warn);font-size:11px;font-weight:600;text-align:center}
.bnav{display:none}
@media (max-width:720px){
  .tabs{display:none}
  .bnav{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;position:fixed;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(16,40,30,.18);padding:6px}
  .bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--ink-3);padding:7px 0;cursor:pointer;position:relative;border-radius:16px}
  .bnav button svg{width:22px;height:22px}
  .bnav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
  .bnav .dot{position:absolute;top:2px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:var(--warn);color:var(--surface);font-size:10px;line-height:16px;text-align:center;padding:0 4px}
  main{padding-bottom:110px}
  .top .hide-sm{display:none}
  .conn span{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
/* common */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.muted{color:var(--ink-3)} .small{font-size:13px}
h2.sec{font-family:var(--f-display);font-weight:800;font-size:25px;margin:0;letter-spacing:-.03em;text-wrap:balance}
h3{font-size:17px;letter-spacing:-.01em;color:var(--ink);margin:0 0 10px;font-weight:700}
.lead{color:var(--ink-2);margin:4px 0 0;max-width:62ch}
.input,select.input,textarea.input{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;outline:none;min-width:0}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
label.f{display:grid;gap:5px;font-size:13px;color:var(--ink-2);font-weight:500;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.sortsel{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:0 4px 0 12px;color:var(--ink-2);font-size:13px;position:relative}
.sortsel svg{width:15px;height:15px;color:var(--accent);flex:none}
.sortsel select{border:0;background:none;font:inherit;font-size:13px;font-weight:600;color:var(--ink);padding:7px 8px 7px 0;outline:none;cursor:pointer;-webkit-appearance:none;appearance:none}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-mute{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)} .p-brass{background:var(--brass-soft);color:var(--brass)}
.ch{display:inline-block;border-radius:5px;padding:1px 6px;font-size:11px;font-weight:600;letter-spacing:.01em}
.ch-trendyol{background:var(--ty-soft);color:var(--ty)} .ch-shopify{background:var(--sh-soft);color:var(--sh)} .ch-hepsiburada{background:var(--hb-soft);color:var(--hb)} .ch-temu{background:var(--tm-soft);color:var(--tm)} .ch-manuel{background:var(--mn-soft);color:var(--mn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.banner{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--brass-soft);color:var(--ink);margin-bottom:16px;font-size:14px}
.banner.bad{background:var(--bad-soft)}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;display:grid;gap:2px}
.kpi:hover{border-color:var(--line-strong)}
.kpi .k{font-size:12.5px;color:var(--ink-3)}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi.warn .v{color:var(--warn)} .kpi.bad .v{color:var(--bad)}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:10px}
@media (max-width:560px){.toolbar{grid-template-columns:1fr}}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink-3)}
.search input{padding-left:38px}
.filters{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-bottom:12px}
/* lists */
.list{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.item:first-child{border-top:0}
.rlist{display:grid;gap:12px}
.rcard{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.rhead{display:flex;justify-content:space-between;gap:10px;padding:12px 14px 8px;align-items:flex-start}
.rno{font-weight:700;font-size:15px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rdl{background:var(--warn-soft);color:var(--warn);font-size:13px;padding:7px 14px}
.rdl.bad{background:var(--bad-soft);color:var(--bad)}
.rqty{position:absolute;top:-6px;left:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--ink);color:var(--surface);font-size:11.5px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.ink{color:var(--ink)}
.item:hover{background:var(--surface-2)}
.item .main{min-width:0;display:grid;gap:3px}
.item .ttl{font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-3)}
.item .end{text-align:right;display:grid;gap:3px;justify-items:end}
@media (max-width:560px){.item.ret{grid-template-columns:auto 1fr}.item.ret .end{grid-column:1/-1;grid-template-columns:auto auto 1fr;align-items:center;justify-items:start;text-align:left}.item.ret .end .row{justify-content:flex-end!important;justify-self:end}}
.qty{font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.qty small{font-size:12px;font-weight:500;color:var(--ink-3);margin-left:3px;letter-spacing:0}
.qty.neg{color:var(--bad)}
.thumb{width:46px;height:46px;border-radius:10px;overflow:hidden;flex:none;display:grid;place-items:center;font-weight:600;font-size:14px;background:var(--brand-soft);color:var(--brand);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}

async function api(path, body){
  const opt = body === undefined ? {method:'GET', credentials:'same-origin'} : {method:'POST', credentials:'same-origin', headers:{'content-type':'application/json'}, body:JSON.stringify(body)};
  let r;
  try { r = await fetch(path, opt); } catch(e) { throw new Error('Sunucuya ulaşılamadı. İnternet bağlantını kontrol et.'); }

  try {
    const d = await api('/api/state' + (S.rev && !force ? '?rev=' + encodeURIComponent(S.rev) : ''));

    // Yeni sürüm yayına alındıysa uygulama kendini yeniler (ana ekrana eklenmiş uygulama açık kalsa bile)
    if (d.build && d.build !== CLIENT_BUILD && !S.sheet && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) {
      let last = null; try { last = JSON.parse(sessionStorage.getItem('lb_reload') || 'null'); } catch(e) {}
      if (!last || last.b !== d.build || Date.now() - last.t > 120000) { try { sessionStorage.setItem('lb_reload', JSON.stringify({b: d.build, t: Date.now()})); } catch(e) {} location.reload(); return; }
    }
    S.settings = d.settings || {}; S.sync = d.sync || S.sync; if (d.usage) S.usage = d.usage; S.skew = Date.parse(d.now) - Date.now();
    if (!d.same) {
      S.rev = d.rev; S.products = new Map(d.products.map(p => [p.id, p])); S.orders = d.orders; S.returns = d.returns; S.moves = d.moves;
      for (const k in S.loaded) S.loaded[k] = true;
      render();
    } else renderSync();
  } catch(e) {
    if (S.authed === false) return;
    S.conn = 'err'; renderSync();

}
let pollTimer = null;
function startPolling(){

  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.authed) refresh(false); });
}
function allMoves(){ return S.moves; }
function startedAt(){ return (S.settings && S.settings.startedAt) || null; }
function ago(isoStr){
  if (!isoStr) return '—';
  const s = Math.max(0, Math.round((Date.now() + S.skew - Date.parse(isoStr)) / 1000));
  if (s < 60) return s + ' sn önce'; if (s < 3600) return Math.round(s/60) + ' dk önce'; if (s < 86400) return Math.round(s/3600) + ' sa önce';

}
function tyState(){

function renderTicker(items){
  const el = $('#ticker'); if (!el) return;

const TSORT = (() => { try { return JSON.parse(localStorage.getItem('lb_tsort') || '{}'); } catch(e) { return {}; } })();
function tblKey(t){ return [...t.tHead.rows[0].cells].map(c => c.textContent.trim()).join('|'); }
function cellVal(td){
  if (!td) return null;
  if (td.dataset.v !== undefined) return td.dataset.v;
  const inp = td.querySelector && td.querySelector('input');
  const t = (inp ? inp.value : td.textContent).replace(/\s+/g, ' ').trim();
  if (!t || t === '—' || t === '-') return null;
  const m = t.match(/[\d][\d.]*(?:,\d+)?/);
  if (m && /^[\s−\-+₺%#]*[\d]/.test(t)) { let n = parseFloat(m[0].replace(/\./g, '').replace(',', '.')); if (/^[\s₺+]*[−\-]/.test(t)) n = -n; return n; }
  return t.toLocaleLowerCase('tr-TR');
}
function sortTable(t, col, dir){
  const tb = t.tBodies[0]; if (!tb) return;
  const rows = [...tb.rows], vals = new Map(rows.map(r => [r, cellVal(r.cells[col])]));
  rows.sort((a, b) => { const x = vals.get(a), y = vals.get(b); if (x === null && y === null) return 0; if (x === null) return 1; if (y === null) return -1;
    if (typeof x !== typeof y) return typeof x === 'number' ? -1 : 1; const c = typeof x === 'number' ? x - y : String(x).localeCompare(String(y), 'tr', {numeric:true}); return dir === 'asc' ? c : -c; });
  for (const r of rows) tb.appendChild(r);
}
function enhanceTables(root){
  for (const t of (root || document).querySelectorAll('table.t')) {
    if (!t.tHead || !t.tBodies[0] || t.tBodies[0].rows.length < 2) continue;
    const key = tblKey(t), st = TSORT[key];

      if (st && st.col === i) { th.classList.add('sorted'); th.insertAdjacentHTML('beforeend', `<span class="arr">${st.dir === 'asc' ? '▲' : '▼'}</span>`); } });
    if (st) sortTable(t, st.col, st.dir);
  }
}

async function loadHome(force){

      // Sunucu arka planda hesaplıyor; birkaç saniye sonra tekrar sor
      S.home = S.home && S.home.data ? {...S.home, at: Date.now() - 55000} : {rev, at: Date.now(), pending: true, perr: data.err || ''};
      S.homeLoading = false; setTimeout(() => { if (S.tab === 'home') homeMaybeLoad(); }, 4000); if (S.tab === 'home') render(); return;
    }
    S.home = {rev, at: Date.now(), data};

  } catch(e) { S.home = S.home && S.home.data ? {...S.home, at: Date.now()} : {rev, at: Date.now(), err: errText(e)}; }
  S.homeLoading = false; if (S.tab === 'home') render();
}

const $ = (s, r=document) => r.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowISO = () => new Date().toISOString();
const localDay = (d=new Date()) => d.toLocaleDateString('sv-SE');
const NF = new Intl.NumberFormat('tr-TR');
const TL = new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',minimumFractionDigits:2,maximumFractionDigits:2});
const fmtN = n => NF.format(Math.round(Number(n)||0));
const fmtTL = n => TL.format(Number(n)||0);
function fmtDate(iso, withTime=true){ if(!iso) return '—'; const d=new Date(iso); if(isNaN(d)) return '—'; return d.toLocaleDateString('tr-TR',{day:'numeric',month:'short',year:'numeric'}) + (withTime? ' ' + d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}) : ''); }
function fmtTime(iso){ const d=new Date(iso); return isNaN(d)?'':d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}); }
function norm(s){ return String(s ?? '').toLocaleLowerCase('tr-TR').replace(/ı/g,'i').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ş/g,'s').replace(/ö/g,'o').replace(/ç/g,'c').replace(/[^a-z0-9]/g,''); }
function searchNorm(s){ return String(s ?? '').toLocaleLowerCase('tr-TR'); }
function num(v){
  if (typeof v === 'number') return isFinite(v) ? v : NaN;
  let s = String(v ?? '').trim().replace(/\s|TL|₺/gi,'');
  if (!s) return NaN;
  if (s.includes(',') && s.includes('.')) { if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g,'').replace(',','.'); else s = s.replace(/,/g,''); }
  else if (s.includes(',')) s = s.replace(',','.');
  const n = Number(s); return isFinite(n) ? n : NaN;
}
function intOr(v, d=0){ const n=num(v); return isFinite(n) ? Math.round(n) : d; }
function skuKey(sku){
  const s = String(sku ?? '').trim().toUpperCase();
  let o = 'p-';
  for (const c of s) o += /[A-Za-z0-9_\-.:@+]/.test(c) ? c : '~' + c.codePointAt(0).toString(16) + '~';
  return o.slice(0, 180);
}
function safeSeg(s){ let o=''; for (const c of String(s)) o += /[A-Za-z0-9_\-.:@+]/.test(c) ? c : '~' + c.codePointAt(0).toString(16); return o.slice(0, 170) || 'x'; }
function orderId(channel, orderNo){ return 'o-' + channel + '-' + safeSeg(String(orderNo).trim()); }
function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function hashHue(s){ let h=0; for (const c of String(s)) h = (h*31 + c.charCodeAt(0)) >>> 0; return h % 360; }
function initials(name){ const w=String(name||'?').trim().split(/\s+/).filter(Boolean); return esc(((w[0]||'?')[0] + (w[1]?w[1][0]:'')).toLocaleUpperCase('tr-TR')); }
// Siparişin ürün görseli; birden fazla çeşit varsa köşede +N
function orderThumb(pkeys, names){
  const ks = [...new Set((pkeys || []).filter(Boolean))]; const p = S.products.get(ks[0]) || {name: (names || [])[0] || ''};
  return `<div style="position:relative">${thumb(p)}${ks.length > 1 ? `<span class="pill p-mute" style="position:absolute;right:-6px;bottom:-6px;padding:1px 5px;font-size:10.5px">+${ks.length - 1}</span>` : ''}</div>`;
}
function thumb(p, cls=''){
  if (p && p.imageAsset) return `<div class="thumb ${cls}"><img alt="" src="/_blob/${esc(p.imageAsset)}" data-fb="${initials(p.name)}"></div>`;
  if (p && p.image && /^https?:\/\//.test(p.image)) return `<div class="thumb ${cls}"><img alt="" loading="lazy" referrerpolicy="no-referrer" src="${esc(p.image)}" data-fb="${initials(p.name)}"></div>`;
  return `<div class="thumb ${cls}">${initials(p && p.name)}</div>`;
}
function chBadge(c){ return CHANNELS[c] ? `<span class="ch ch-${c}">${esc(CHANNELS[c].name)}</span>` : ''; }
function isLow(p){ return p.qty > 0 && p.qty <= (p.min ?? 5); }
function stockPill(p){
  if (p.qty < 0) return '<span class="pill p-bad">Eksi stok</span>';
  if (p.qty === 0) return '<span class="pill p-bad">Tükendi</span>';

function pool(items, n, fn){ let i=0; const workers = Array.from({length:Math.min(n, items.length)}, async () => { while (i < items.length) { const k=i++; await fn(items[k], k); } }); return Promise.all(workers); }
async function retry(fn, tries=5){
  let d = 350;
  for (let i=0;; i++) {
    try { return await fn(); }
    catch (e) { if (i < tries && e && (e.code === 'unavailable' || e.code === 'resource_exhausted')) { await sleep(d + Math.random()*d); d *= 2; continue; } throw e; }
  }
}

function filteredProducts(){
  const q = searchNorm(S.q.trim());
  let ps = productsArr().filter(p => (!q || searchNorm(`${p.name} ${p.sku} ${p.barcode}`).includes(q)) && (S.filter==='all' || (S.filter==='active' && p.qty > 0) || (S.filter==='low' && isLow(p)) || (S.filter==='zero' && p.qty <= 0)) && (!S.ch || p.channels.includes(S.ch)));
  const byName = (a,b) => a.name.localeCompare(b.name, 'tr');
  const val = p => Math.max(0, p.qty) * (p.cost || 0);
  const SORTS = {
    name_asc: byName, name_desc: (a,b) => -byName(a,b),
    qty_desc: (a,b) => b.qty - a.qty || byName(a,b), qty_asc: (a,b) => a.qty - b.qty || byName(a,b),
    value_desc: (a,b) => val(b) - val(a) || byName(a,b),
    new: (a,b) => String(b.createdAt||'').localeCompare(String(a.createdAt||'')) || byName(a,b),
    updated: (a,b) => String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')) || byName(a,b)
  };
  ps.sort(SORTS[S.psort] || byName);
  return ps;
}

function parseCostRows(f){
  const H = f.headers;
  const costH = H.filter(h => !/kar|marj|oran|yuzde|%/.test(norm(h).replace('karar','')) || /^(urun)?maliyet/.test(norm(h)));
  const map = {sku:findCol(H, COLS.sku) || findCol(H, COLS.model), barcode:findCol(H, COLS.barcode), cost:findCol(costH, COST_COLS), stock:findCol(H.filter(h => !/kod|min|satis|gun/.test(norm(h))), COLS.stock)};
  if (!map.cost && !map.stock) throw new Error(`Alış fiyatı sütunu bulunamadı. Sütun başlığı "Alış fiyatı" ya da "Birim alış fiyatı (TL)" olmalı. Okunan sütunlar: ${H.slice(0,12).join(', ')}`);
  if (!map.sku && !map.barcode) throw new Error(`Stok kodu ya da barkod sütunu bulunamadı. Okunan sütunlar: ${H.slice(0,12).join(', ')}`);
  const items = []; let skipped = 0;
  for (const r of f.rows) {
    const sku = map.sku ? String(r[map.sku] ?? '').trim() : '', barcode = map.barcode ? String(r[map.barcode] ?? '').trim() : '';
    const raw = map.cost ? r[map.cost] : ''; const cost = num(raw);
    const sraw = map.stock ? r[map.stock] : ''; const stock = num(sraw);
    if (!sku && !barcode) continue;
    const okCost = !(raw === '' || raw === null || raw === undefined || !isFinite(cost) || cost < 0);
    const okStock = !(sraw === '' || sraw === null || sraw === undefined || !isFinite(stock) || stock < 0);
    if (!okCost && !okStock) { skipped++; continue; }
    items.push({sku, barcode, cost: okCost ? Math.round(cost*100)/100 : null, stock: okStock ? Math.round(stock) : null});
  }
  return {map, items, skipped};
}
async function onCostFile(file){
  if (!file) return;
  S.costImp = {file:file.name, computing:true}; renderSheet(false);
  try {
    const f = await readFile(file);
    if (f.json) throw new Error('Bu bir Excel ya da CSV dosyası değil.');
    const {map, items, skipped} = parseCostRows(f);
    if (!items.length) throw new Error('Dosyada fiyatı dolu satır bulunamadı.');
    const r = await api('/api/costs', {items, dry:true, setStock:false});
    S.costImp = {file:file.name, rows:f.rows.length, map, items, skipped, stats:r.stats, sample:r.sample, stockSample:r.stockSample, setStock:false};
  } catch(e) { S.costImp = {file:file.name, error:errText(e)}; }
  renderSheet(false);
}
async function recomputeCosts(){
  const C = S.costImp; if (!C || !C.items) return; C.computing = true; renderSheet(false);
  try { const r = await api('/api/costs', {items:C.items, dry:true, setStock:!!C.setStock}); C.stats = r.stats; C.sample = r.sample; C.stockSample = r.stockSample; } catch(e) { C.error = errText(e); }
  C.computing = false; renderSheet(false);
}
async function runCosts(){
  const C = S.costImp; if (!C || !C.items || S.busy) return;
  await run(async () => {
    const r = await api('/api/costs', {items:C.items, setStock:!!C.setStock});

const PERIODS = [['today','Bugün'],['yesterday','Dün'],['month','Bu ay'],['d30','Son 30 gün'],['custom','Tarih seç']];
function periodRange(id, cf, ct){
  const d0 = new Date(); d0.setHours(0,0,0,0);
  const add = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
  if (id === 'today') return [d0, add(d0,1)];
  if (id === 'yesterday') return [add(d0,-1), d0];
  if (id === 'week') { const wd = (d0.getDay()+6)%7; return [add(d0,-wd), add(d0,1)]; }
  if (id === 'month') return [new Date(d0.getFullYear(), d0.getMonth(), 1), add(d0,1)];
  if (id === 'lastmonth') return [new Date(d0.getFullYear(), d0.getMonth()-1, 1), new Date(d0.getFullYear(), d0.getMonth(), 1)];
  if (id === 'd7') return [add(d0,-6), add(d0,1)];
  if (id === 'd30') return [add(d0,-29), add(d0,1)];
  const f = cf ? new Date(cf+'T00:00') : add(d0,-6), t = ct ? add(new Date(ct+'T00:00'),1) : add(d0,1);
  return [f, t];
}

async function loadProfit(force){

  const ck = f.toISOString() + '|' + t.toISOString(), key = ck + '|' + S.rev;
  if (!force && (P.loading || P.key === key)) return;

  if (!force && P.key && P.key.startsWith(ck + '|') && Date.now() - (P.at || 0) < 60000) return;
  P.cache = P.cache || {};
  if (P.cache[ck] && P.data !== P.cache[ck]) { P.data = P.cache[ck]; P.err = ''; if (S.tab === 'profit') setTimeout(render, 0); }
  P.loading = true; P.key = key; P.err = '';

async function importDetails(files){
  for (const file of files) {
    try {
      const f = await readFile(file); if (!f.rows) throw new Error('Excel dosyası seç.');
      const H = f.headers, has = n => H.includes(n);
      const inv = ((file.name.match(/_(\d{5,})_detay/) || [])[1]) || file.name.replace(/\W+/g, '').slice(0, 30);
      let kind, rows;
      if (has('Ek Ücret') && has('Sipariş No')) { kind = 'service'; rows = f.rows.map(r => ({orderNo: String(r['Sipariş No']).trim(), amount: num(r['Ek Ücret'])})); }
      else if (has('Kesilen Bedel') && has('Sipariş No')) { kind = 'penalty'; rows = f.rows.map(r => ({orderNo: String(r['Sipariş No']).trim(), amount: num(r['Kesilen Bedel']), type: r['Fatura Tipi'] || 'Ceza'})); }
      else if (has('Gönderi Ücreti (KDV Dahil)')) { toast(`${file.name}: kargo faturaları Trendyol'dan otomatik okunuyor, yüklemeye gerek yok.`); continue; }
      else throw new Error('Bu dosya tanınmadı. Sütunlar: ' + H.slice(0, 10).join(', '));
      rows = rows.filter(r => r.orderNo && isFinite(r.amount));
      const total = rows.reduce((a, r) => a + r.amount, 0);
      if (!(await confirmBox(`<b>${esc(file.name)}</b>: ${kind === 'service' ? 'Platform hizmet bedeli' : 'Ceza faturası'} · <b>${fmtN(rows.length)} satır</b>, toplam <b>${fmtTL(total)}</b>. Siparişlere yazılsın mı?`, 'Kaydet'))) continue;
      await run(async () => { const r = await api('/api/finance/details', {kind, invoice: inv, rows}); profS().key = ''; await refresh(true); toast(`${fmtN(r.saved)} sipariş güncellendi.`); });
    } catch(e) { toast(file.name + ': ' + errText(e), true); }
  }
}

async function saveAds(items, source, msg){

function adDate(v){
  if (v instanceof Date && !isNaN(v)) return new Date(v.getTime() - v.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  if (typeof v === 'number' && v > 30000 && v < 80000) { const d = new Date(Date.UTC(1899, 11, 30) + v * 86400000); return d.toISOString().slice(0, 10); }
  const t = String(v || '').trim(); let m;
  if ((m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if ((m = t.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})/))) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return null;
}
async function importAds(file){
  try {
    const f = await readFile(file); if (!f.rows) throw new Error('Excel ya da CSV dosyası seç.');
    const nk = h => searchNorm(h).replace(/ı/g,'i').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ş/g,'s').replace(/ö/g,'o').replace(/ç/g,'c');
    const dateCol = f.headers.find(h => /tarih|date/.test(nk(h))) || f.headers.find(h => /^gun$|^day$|gun\b/.test(nk(h)) && !/butce|budget|gunluk/.test(nk(h)));
    const amtCol = f.headers.find(h => /harca|maliyet|spend|cost|gider|tuketilen/.test(nk(h)) && !/butce|budget|birim|tiklama basi|cpc/.test(nk(h))) || f.headers.find(h => /tutar|amount/.test(nk(h)));
    if (!dateCol || !amtCol) throw new Error('Dosyada tarih ve harcama sütunu bulunamadı. Bulunan sütunlar: ' + f.headers.slice(0, 12).join(', '));
    const kdv = $('#ad-kdv') && $('#ad-kdv').checked; const byDay = new Map(); let skipped = 0;
    for (const r of f.rows) { const d = adDate(r[dateCol]); const a = num(r[amtCol]); if (!d || !isFinite(a)) { skipped++; continue; } byDay.set(d, (byDay.get(d) || 0) + a * (kdv ? 1.2 : 1)); }
    if (!byDay.size) throw new Error('Okunabilir satır bulunamadı.');
    const items = [...byDay].map(([day, amount]) => ({day, amount: Math.round(amount * 100) / 100})).sort((a, b) => a.day < b.day ? -1 : 1);
    const total = items.reduce((a, x) => a + x.amount, 0);
    if (!(await confirmBox(`<b>${esc(dateCol)}</b> ve <b>${esc(amtCol)}</b> sütunlarından <b>${fmtN(items.length)} gün</b> (${esc(items[0].day)} – ${esc(items[items.length-1].day)}), toplam <b>${fmtTL(total)}</b> reklam harcaması okundu${skipped ? `; ${fmtN(skipped)} satır atlandı` : ''}. Bu günlerin mevcut kayıtlarının üzerine yazılsın mı?`, 'Kaydet'))) return;
    await saveAds(items, 'rapor', `${fmtN(items.length)} günün reklam harcaması kaydedildi.`);
  } catch(e) { toast(errText(e), true); }
}

async function computePreview(){

      const plain = orders.map(o => ({orderNo:o.orderNo, date:o.date, lines:[...o.lines.values()].map(l => ({key:l.key, sku:l.sku, barcode:l.barcode, name:l.name, image:l.image, qty:l.qty, status:l.status, price:l.price}))}));

      const plain = items.map(x => ({sku:x.sku, name:x.name, image:x.image, barcode:x.barcode, stock:x.stock, cost:x.cost, min:x.min}));
      const calls = chunk(plain, 500).map(part => ({path:'/api/ingest/products', body:{channel, items:part, useStock:I.useStock, overwrite:I.overwrite}}));

}

    case 'fin-sync': { S.syncing = true; render(); try { const r = await api('/api/finance/sync', {}); toast(`Trendyol kesintileri okundu: ${fmtN(r.result.orders)} sipariş.`); } catch(e) { toast(errText(e), true); } S.syncing = false; await refresh(true); profS().key = ''; render(); break; }
    case 'open-costs': S.costImp = null; openSheet('costs'); break;
    case 'cost-reset': S.costImp = null; renderSheet(false); break;
    case 'cost-run': await runCosts(); break;
    case 'sync-now': await syncNow(); break;
    case 'resync-products': await saveSetting({resyncProducts:true}, 'Ürün listesi bir sonraki eşitlemede yeniden taranacak.'); break;
    case 'logout': try { await fetch('/api/logout', {method:'POST'}); } catch(e){} try { ['lb_seen','lb_home','lb_mkt','lb_wx'].forEach(k => localStorage.removeItem(k)); sessionStorage.removeItem('lb_live'); } catch(e) {} S.authInfo = null; closeSheetForce(); S.authed = false; S.rev = null; render(); break;
    case 'close': closeSheet(); break;
  }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === 'f-login') {
    const btn = e.target.querySelector('button'); btn.disabled = true;
    try { if (S.logoutP) await S.logoutP; await api('/api/login', {username:$('#lg-user').value, password:$('#lg-pass').value}); S.authInfo = null; await afterLogin(); }
    catch(err) { toast(errText(err), true); }
    btn.disabled = false; return;
  }
  if (id === 'f-repp') { const R = repS(); let f = $('#rp-from').value, t = $('#rp-to').value; if (!f || !t) return toast('İki tarihi de seç.', true); if (f > t) [f, t] = [t, f]; R.cf = f; R.ct = t; render(); return; }
  if (id === 'f-exp') {
    const name = $('#ex-name').value.trim(), amount = num($('#ex-amt').value), day = $('#ex-day').value;
    if (!name) return toast('Gider adını yaz.', true);
    if (!isFinite(amount) || amount <= 0) return toast('Geçerli bir tutar yaz.', true);
    const E = S.expEdit;
    await run(async () => { await api(E ? '/api/expenses/update' : '/api/expenses/add', {id: E && E.id, name, amount, day}); S.expEdit = null; profS().key = ''; profS().cache = {}; S.home && (S.home.at = 0); await refresh(true); toast(E ? 'Gider güncellendi.' : `${name}: ${fmtTL(amount)} gider olarak eklendi.`); });
    return;
  }
  if (id === 'f-new') submitNewProduct();
  else if (id === 'f-move') submitMove();
  else if (id === 'f-info') submitInfo();
  else if (id === 'f-order') submitNewOrder();
  else if (id === 'f-ret') submitReturn();
  else if (id === 'f-tyrej') submitTyReject();
  else if (id === 'f-period') { const P = profS(); P.cf = $('#pf-from').value; P.ct = $('#pf-to').value; if (!P.cf || !P.ct) return toast('İki tarihi de seç.', true); P.data = null; P.key = ''; render(); }
  else if (id === 'f-ad') { const day = $('#ad-day').value, amount = num($('#ad-amt').value); if (!day) return toast('Gün seç.', true); if (!isFinite(amount) || amount < 0) return toast('Harcamayı sayı olarak yaz. Örn. 350,50', true); await saveAds([{day, amount}], 'manuel', amount ? `${day} için ${fmtTL(amount)} reklam gideri kaydedildi.` : `${day} reklam kaydı silindi.`); }
  else if (id === 'f-fees') { const v = k => num($(k).value); const body = {feeCargoT1:v('#fe-ct1'), feeCargoT2:v('#fe-ct2'), feeCargoT3:v('#fe-ct3'), feeServiceTy:v('#fe-sty'), feeServiceFast:v('#fe-sfast'), serviceCutoff:v('#fe-scut'), baremMaxDesi:v('#fe-bmd'), feeCargoSh:v('#fe-csh'), stopaj:v('#fe-stp')}; if (!(body.serviceCutoff >= 0 && body.serviceCutoff <= 24)) return toast('Son sipariş saati 0–24 arasında olmalı.', true); if (Object.values(body).some(x => !isFinite(x) || x < 0)) return toast('Değerleri sayı olarak yaz. Örn. 46,48', true); body.desiMode = $('#fe-desimode').checked; try { body.desiTables = {tex: parseDesi($('#fe-desi-tex').value), ptt: parseDesi($('#fe-desi-ptt').value)}; } catch(err) { return toast(err.message, true); } if (!body.desiTables.tex.length || !body.desiTables.ptt.length) return toast('İki desi tablosu da dolu olmalı.', true); await saveSetting(body, 'Kesinti varsayımları kaydedildi.'); const P = profS(); P.key = ''; P.pricing = null; render(); }
  else if (id === 'f-start') { const v = $('#st-date').value; if (!v) return toast('Bir tarih seç.', true); await saveSetting({startedAt:new Date(v).toISOString()}, 'Başlangıç tarihi kaydedildi.'); if (S.imp && S.imp.preview) computePreview(); }
});
let qTimer;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; clearTimeout(qTimer); qTimer = setTimeout(() => { const l = $('#plist'); if (l) l.innerHTML = productList(); }, 120); }
  if (t.id === 'oq') { S.oq = t.value; S.opage = 1; clearTimeout(qTimer); qTimer = setTimeout(render, 300); }
  if (t.id === 'bdq') { if (S.sheet) S.sheet.q = t.value; applyBdFilter(); }
  if (t.id === 'pq') { profS().q = t.value; profS().opage = 1; clearTimeout(qTimer); qTimer = setTimeout(render, 200); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.cost) saveCost(t);
  if (t.id === 'imp-file') onImportFile(t.files[0]);
  if (t.id === 'ad-file' && t.files[0]) { importAds(t.files[0]); t.value = ''; }
  if (t.id === 'det-file' && t.files.length) { importDetails([...t.files]); t.value = ''; }
  if (t.id === 'cost-file') onCostFile(t.files[0]);
  if (t.id === 'cost-setstock') { S.costImp.setStock = t.checked; recomputeCosts(); }
  if (t.id === 'fe-desimode') { const w = $('#fe-desi-wrap'); if (w) w.hidden = !t.checked; }
  if (t.id === 'set-push') saveSetting({pushStock:t.checked}, t.checked ? 'Stok değişiklikleri Trendyol\'a gönderilecek.' : 'Trendyol\'a stok gönderimi durduruldu.');
  if (t.id === 'imp-kind') { S.imp.kind = t.value; computePreview(); }
  if (t.id === 'imp-ch') { S.imp.channel = t.value; computePreview(); }
  if (t.id === 'imp-usestock') { S.imp.useStock = t.checked; computePreview(); }
  if (t.id === 'imp-overwrite') { S.imp.overwrite = t.checked; computePreview(); }
  if (t.id === 'psort') { S.psort = t.value; try { localStorage.setItem('lb_psort', t.value); } catch(e) {} const pl = $('#plist'); if (pl) pl.innerHTML = productList(); else render(); }
  if (t.id === 'set-auto') saveSetting({autoAccept:t.checked}, t.checked ? 'Onaylanan iadeler otomatik stoğa eklenecek.' : 'İadeleri depoya ulaşınca elle onaylayacaksın.');
  if (t.id === 'set-prodinit') saveSetting({prodInitial:t.checked}, 'Kaydedildi.');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dialog-root').innerHTML) closeSheet(); if (e.key === 'Enter' && e.target.dataset && e.target.dataset.cost) e.target.blur(); });
document.addEventListener('error', e => { const t = e.target; if (t && t.tagName === 'IMG' && t.dataset.fb !== undefined) { const p = t.parentElement; if (p) p.textContent = t.dataset.fb; } }, true);
['dragover','dragleave','drop'].forEach(ev => document.addEventListener(ev, e => {
  const d = e.target.closest && e.target.closest('#drop'); if (!d) return; e.preventDefault();
  if (ev === 'dragover') d.classList.add('over'); else d.classList.remove('over');
  if (ev === 'drop' && e.dataTransfer.files[0]) onImportFile(e.dataTransfer.files[0]);
}));
// Son görülen bant ve hava durumu açılışta hemen gösterilir
try { if (S.authed) { const m = JSON.parse(localStorage.getItem('lb_mkt') || 'null'); if (m) renderTicker(m); const w = JSON.parse(localStorage.getItem('lb_wx') || 'null'); if (w) renderWeather(w, !!wxCoords()); } } catch(e) {}
render();
startPolling();
</script>
</body></html>
